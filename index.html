<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Marco Rocha — Portfolio</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow-x: hidden; /* no horizontal scroll */
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 25px 0;
      background: #000;
      color: white;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 1px solid white;
      background: #111;
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 9999;
    }

    .back-to-top:hover {
      transform: scale(1.08);
      transition: 0.2s;
    }
  </style>
</head>

<body>

  <img src="image.jpg" alt="Portfolio image">

  <footer class="footer">
    More being uploaded soon. Thanks for making it this far.
  </footer>

  <button class="back-to-top"
    onclick="window.scrollTo({top:0, behavior:'smooth'})">
    ↑
  </button>

</body>
</html>

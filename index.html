<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Marco Rocha — Portfolio</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow-x: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 25px 0;
      background: #000;
      color: white;
      font-size: 14px;
      font-family: Arial, sans-serif;
      position: relative;
      z-index: 2;
    }

    .floating-buttons {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: flex;
      gap: 12px;
      z-index: 999999;
    }

    .resume-btn,
    .back-to-top {
      height: 50px;
      border-radius: 30px;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      transition: all .3s ease;
    }

    .resume-btn {
      width: 90px;
      font-size: 14px;
    }

    .back-to-top {
      width: 50px;
      font-size: 24px;
    }

    .resume-btn:hover,
    .back-to-top:hover {
      transform: translateY(-3px) scale(1.05);
      background: rgba(255,255,255,0.25);
    }

    .resume-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      z-index: 1000000;
    }

    .resume-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 90%;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
    }

    .resume-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 20px;
      color: white;
      font-size: 32px;
      cursor: pointer;
      z-index: 2;
    }
  </style>
</head>

<body>

  <img src="image.jpg" alt="Portfolio image">

  <footer class="footer">
    More being uploaded soon. Thanks for making it this far.
  </footer>

  <div class="floating-buttons">
    <button class="resume-btn" onclick="openResume()">Resume</button>

    <button class="back-to-top"
      onclick="window.scrollTo({top:0, behavior:'smooth'})">
      ↑
    </button>
  </div>

  <div id="resumeModal" class="resume-modal">
    <div class="resume-content">
      <span class="close" onclick="closeResume()">×</span>
      <iframe src="resume.pdf"></iframe>
    </div>
  </div>

  <script>
    function openResume(){
      document.getElementById("resumeModal").style.display = "block";
    }

    function closeResume(){
      document.getElementById("resumeModal").style.display = "none";
    }
  </script>

</body>
</html>

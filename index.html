<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Marco Rocha — Portfolio</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow-x: hidden; /* no horizontal scroll */
      cursor: none;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 25px 0;
      background: #000;
      color: white;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 1px solid white;
      background: #111;
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 9999;
    }

    .back-to-top:hover {
      transform: scale(1.08);
      transition: 0.2s;
    }

    .cursor-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
    }

    .cursor-trail {
      position: fixed;
      width: 60px;
      height: 60px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      backdrop-filter: blur(3px);
    }
  </style>
</head>

<body>

  <div class="cursor-dot"></div>
  <div class="cursor-trail"></div>

  <img src="image.jpg" alt="Portfolio image">

  <footer class="footer">
    More being uploaded soon. Thanks for making it this far.
  </footer>

  <button class="back-to-top"
  onclick="window.scrollTo({top:0, behavior:'smooth'})">
    ↑
  </button>

<script>
const dot = document.querySelector(".cursor-dot");
const trail = document.querySelector(".cursor-trail");

let mouseX = 0;
let mouseY = 0;
let trailX = 0;
let trailY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  dot.style.left = mouseX + "px";
  dot.style.top = mouseY + "px";
});

function animate() {
  trailX += (mouseX - trailX) * 0.12;
  trailY += (mouseY - trailY) * 0.12;

  trail.style.left = trailX + "px";
  trail.style.top = trailY + "px";

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>

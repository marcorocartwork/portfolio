<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Marco Rocha — Portfolio</title>

<style>

html{
scroll-behavior:smooth;
}

html,body{
margin:0;
padding:0;
background:#000;
overflow-x:hidden;
font-family:Arial,sans-serif;
}

img{
display:block;
width:100%;
height:auto;
}

.footer{
width:100%;
text-align:center;
padding:70px 20px 140px;
background:#000;
color:white;
font-size:14px;
line-height:1.8;
box-sizing:border-box;
}

/* Buttons */

.floating-buttons{
position:fixed;
bottom:25px;
right:25px;
display:flex;
gap:12px;
z-index:999999;
}

.resume-btn,
.back-to-top{

height:50px;

border-radius:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

color:white;

cursor:pointer;

box-shadow:
0 8px 30px rgba(0,0,0,.45),
inset 0 1px 1px rgba(255,255,255,.1);

}

.resume-btn{
width:90px;
font-size:14px;
}

.back-to-top{
width:50px;
font-size:24px;
}


/* POPUP */

.resume-modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.82);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

z-index:1000000;
}


/* DESKTOP */

.resume-content{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:auto;
height:auto;

max-width:88vw;
max-height:92vh;

padding:10px;

border-radius:24px;

background:rgba(25,25,25,.82);

backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

overflow:auto;

box-sizing:border-box;

box-shadow:
0 25px 60px rgba(0,0,0,.7);

border:1px solid rgba(255,255,255,.08);

}


.resume-image{

display:block;

width:auto;
height:auto;

max-width:86vw;
max-height:88vh;

object-fit:contain;

border-radius:12px;

background:white;

}


/* Close button */

.close{

position:fixed;

top:18px;
right:28px;

font-size:42px;

color:#e1a271;

cursor:pointer;

z-index:1000001;

}


/* MOBILE PORTRAIT */

@media (max-width:768px){

.resume-content{

width:100vw;
height:100vh;

top:0;
left:0;

transform:none;

padding:0;

border-radius:0;

overflow-y:auto;
overflow-x:hidden;

background:rgba(25,25,25,.96);

}

.resume-image{

width:100%;
height:auto;

max-width:none;
max-height:none;

object-fit:unset;

border-radius:0;

}

.close{

top:12px;
right:15px;

font-size:36px;

}

}


/* MOBILE LANDSCAPE FIX */

@media (max-width:1000px) and (orientation:landscape){

.resume-modal{
overflow:hidden;
}

.resume-content{

width:100%;
height:100%;

top:0;
left:0;

transform:none;

padding:0;

border-radius:0;

overflow-y:auto;
overflow-x:hidden;

}

.resume-image{

width:100%;
height:auto;

max-width:100%;
max-height:none;

object-fit:contain;

border-radius:0;

}

}


/* Rotate intro */

.rotate-notice{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.95);

z-index:999999999;

justify-content:center;
align-items:center;

flex-direction:column;

color:white;

}

.phone-wrap{

font-size:75px;

animation:rotatePhone 2s ease infinite;

margin-bottom:20px;

}

.rotate-text{

font-size:18px;

opacity:.8;

}

@keyframes rotatePhone{

0%{
transform:rotate(0deg);
}

40%{
transform:rotate(0deg);
}

100%{
transform:rotate(90deg);
}

}

</style>
</head>

<body>

<div id="rotateNotice"
class="rotate-notice">

<div class="phone-wrap">
📱
</div>

<div class="rotate-text">
Rotate for a better experience
</div>

</div>


<img src="image.jpg"
alt="Portfolio image">


<footer class="footer">

More being uploaded soon.<br>
Thanks for making it this far.

</footer>


<div class="floating-buttons">

<button
class="resume-btn"
type="button"
onclick="openResume()">

Resume

</button>


<button
class="back-to-top"
type="button"
onclick="scrollToTop()">

↑

</button>

</div>


<div id="resumeModal"
class="resume-modal">

<span
class="close"
onclick="closeResume()">

×

</span>

<div class="resume-content">

<img
src="resume.png"
class="resume-image"
alt="Resume">

</div>

</div>


<script>

function scrollToTop(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function openResume(){

document.getElementById(
"resumeModal"
).style.display="block";

document.body.style.overflow="hidden";

document.documentElement.style.overflow="hidden";

}


function closeResume(){

document.getElementById(
"resumeModal"
).style.display="none";

document.body.style.overflow="";

document.documentElement.style.overflow="";

}


/* click outside */

document.getElementById(
"resumeModal"
).addEventListener("click",

function(e){

if(
e.target.id==="resumeModal"
){

closeResume();

}

});


/* mobile intro */

if(window.innerWidth < 768){

const notice=
document.getElementById(
"rotateNotice"
);

notice.style.display=
"flex";

setTimeout(()=>{

notice.style.display=
"none";

},5000);

}

</script>

</body>
</html>
